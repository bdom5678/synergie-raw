name: Sophonie Android

on:
  push:
    branches: [ccr-2019a868-qtmewc]
    paths:
      - "sophonie/android/**"
      - ".github/workflows/sophonie-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Même clé de signature d'une compilation à l'autre : les mises à jour s'installent par-dessus.
      - name: Clé de signature persistante
        uses: actions/cache@v4
        with:
          path: ~/.sophonie/sophonie.jks
          key: sophonie-release-keystore-v1

      - name: Créer la clé si absente
        env:
          SOPHONIE_KEYSTORE_PASS: sophonie-cle-locale
        run: |
          if [ ! -f ~/.sophonie/sophonie.jks ]; then
            mkdir -p ~/.sophonie
            keytool -genkeypair -keystore ~/.sophonie/sophonie.jks -storepass "$SOPHONIE_KEYSTORE_PASS" \
              -alias sophonie -keypass "$SOPHONIE_KEYSTORE_PASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Sophonie,O=Sophonie,C=CM"
          fi

      - name: Compiler les APK
        env:
          SOPHONIE_KEYSTORE_PASS: sophonie-cle-locale
        run: |
          export SOPHONIE_KEYSTORE=$HOME/.sophonie/sophonie.jks
          gradle -p sophonie/android assembleCompletRelease assembleEssentielRelease --no-daemon --stacktrace

      - name: Renommer
        run: |
          cp sophonie/android/app/build/outputs/apk/complet/release/app-complet-release.apk Sophonie-complet.apk
          cp sophonie/android/app/build/outputs/apk/essentiel/release/app-essentiel-release.apk Sophonie-essentiel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sophonie-apk
          path: Sophonie-*.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sophonie-v2.${{ github.run_number }}-signe
          name: Sophonie 2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            Sophonie-essentiel.apk
            Sophonie-complet.apk
          body: |
            Application Android Sophonie.
            - Sophonie-essentiel.apk : à essayer en premier, moins souvent bloquée par Play Protect (sans lecture directe des SMS ni du journal d'appels, qui restent visibles par les notifications).
            - Sophonie-complet.apk : tous les accès.
