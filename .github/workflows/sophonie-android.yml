name: Sophonie Android

on:
  push:
    branches: [ccr-2019a868-qtmewc]
    paths:
      - "sophonie/android/**"
      - ".github/workflows/sophonie-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Même clé de signature d'une compilation à l'autre : les mises à jour s'installent par-dessus.
      - name: Clé de signature persistante
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sophonie-debug-keystore-v1

      - name: Créer la clé si absente
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compiler l'APK
        run: gradle -p sophonie/android assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: cp sophonie/android/app/build/outputs/apk/debug/app-debug.apk Sophonie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sophonie-apk
          path: Sophonie.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sophonie-v2.${{ github.run_number }}
          name: Sophonie 2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Sophonie.apk
          body: |
            Application Android Sophonie. Sur le téléphone : téléchargez Sophonie.apk, ouvrez-le et autorisez l'installation.
